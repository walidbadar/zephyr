description: Cadence SD Host controller

compatible: "cdns,sdhc"

include: [sdhc.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  broken-cd:
    type: boolean
    description:
      There is no card detection available; polling must be used.
