description: |
  Native simulator video source reading raw frames from a host named pipe
  (FIFO), or capturing them from a host V4L2 device.

  The application selects the frame format through the video API. A FIFO
  writer must produce frames of exactly that format, and a V4L2 device must
  provide it as is, except RGB565, which is converted on the host from YUYV
  when the device does not provide it.

  See the native_sim board documentation for how to feed the FIFO and for the
  details of the driver behaviour.

compatible: "zephyr,native-sim-video-fifo"

include: base.yaml

properties:
  fifo-path:
    type: string
    description: |
      Path of the host named pipe to read the frames from, or of a V4L2
      capture device such as /dev/video0. A FIFO is created if the path does
      not exist yet. Defaults to /tmp/zephyr-<device>-<pid>.fifo. It can be
      overridden at runtime with the --<device>=<path> command line option.

  poll-interval-ms:
    type: int
    default: 10
    description: |
      Delay before reading the host source again when it did not provide a
      complete frame: no FIFO writer is attached, the writer is slower than
      the driver, or the V4L2 device has no frame ready yet. This does not
      limit the frame rate: the driver reads again immediately after a frame
      is completed.
